name: smoke
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Отдаётся ли myfin раннеру GitHub
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: data.json
          if-no-files-found: warn
