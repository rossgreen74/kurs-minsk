name: Обновление курсов

on:
  schedule:
    # каждые 15 минут с 05:00 до 18:59 UTC = с 08:00 до 21:59 по Минску.
    # GitHub запускает расписание с опозданием, иногда на 10–20 минут, —
    # поэтому на странице стоит «обновлено N минут назад», а не обещание частоты.
    - cron: "*/15 5-18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # build.py падает, если данные не прошли проверку вменяемости.
      # Тогда прогон рушится, деплоя нет и на странице остаётся прошлый снимок —
      # лучше показать курс получасовой давности, чем мусор.
      - name: Снять курсы
        run: python build.py
      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp index.html data.json _site/
          cp -R vendor _site/vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
